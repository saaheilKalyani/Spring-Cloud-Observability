# =====================================================================================================
#  LESSON 3 - Prometheus PULLS metrics: every scrape_interval it does  GET /actuator/prometheus  on each target.
#  (The Spring Boot app never pushes anything - it only exposes text; Prometheus is the one that collects.)
# =====================================================================================================
global:
  scrape_interval: 5s          # production: 15-60s. 5s keeps the classroom graphs lively.
  evaluation_interval: 5s      # how often alert rules are evaluated

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: product-service            # three instances => ONE job, three `instance` label values
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["product-service-1:8080", "product-service-2:8080", "product-service-3:8080"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8080"]

  - job_name: bff
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["web-bff:8080", "mobile-bff:8080"]
