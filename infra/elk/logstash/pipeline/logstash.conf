# =====================================================================================================
#  LESSON 1 - the LOGSTASH pipeline:   input  ->  filter  ->  output
# =====================================================================================================

# INPUT: every Spring service opens a TCP connection to logstash:5000 and sends one JSON object per line
#        (Logback's LogstashTcpSocketAppender).  `json_lines` splits the stream into events.
input {
  tcp {
    port => 5000
    codec => json_lines
    ecs_compatibility => disabled
  }
}

# FILTER: the place to enrich, clean and route events BEFORE they are stored.
filter {

  # 1) make problems easy to find in Kibana:  tags : "needs-attention"
  if [level] == "ERROR" {
    mutate { add_tag => ["needs-attention"] }
  }

  # 2) housekeeping: drop technical fields nobody queries (less to store, faster to search)
  mutate {
    remove_field => ["@version", "level_value", "host", "port"]
  }

  # 3) example of a conditional rule (uncomment to experiment live!):
  # drop everything from a noisy logger
  # if [logger] =~ /^com\.netflix/ { drop { } }
}

# OUTPUT: one index per day  ->  spring-logs-2025.01.31
#         (daily indices make retention trivial: delete yesterday's index instead of millions of documents)
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "spring-logs-%{+YYYY.MM.dd}"
  }

  # Debug aid: uncomment, then `docker compose up -d logstash` and watch `docker logs -f logstash`
  # stdout { codec => rubydebug }
}
