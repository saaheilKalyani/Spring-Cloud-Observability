server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ${BFF_NAME:bff}          # compose sets web-bff / mobile-bff -> two different Eureka services from ONE jar
  lifecycle:
    timeout-per-shutdown-phase: 5s
  cloud:
    loadbalancer:
      cache:
        ttl: 5s

lab:
  instance-id: ${INSTANCE_ID:bff-local}
  admin:
    enabled: true
  lb:
    enabled: true
    default-strategy: round-robin
  logging:
    logstash-destination: ${LOGSTASH_DESTINATION:logstash:5000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    instance-info-replication-interval-seconds: 5
    healthcheck:
      enabled: true
  instance:
    instance-id: ${spring.application.name}:${lab.instance-id}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 3
    lease-expiration-duration-in-seconds: 6

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,mappings,env
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
