# =====================================================================================================
#  nginx = (1) static web server for the lab UI   (2) reverse proxy to the back-end containers.
#
#  The browser only ever talks to  http://localhost:8800 (UI_PORT)  -> no CORS headaches, one origin.
#  Targets are written as VARIABLES + Docker's embedded DNS (127.0.0.11) so nginx still starts when an
#  optional container (Kibana, Prometheus ...) is not running.
# =====================================================================================================
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Classroom: always show the latest file you just edited
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Host ports chosen in .env, injected by envsubst when the container starts (see docker-compose.yml: ui)
    location = /config.js {
        default_type application/javascript;
        return 200 "window.LAB_PORTS={gateway:${LAB_GATEWAY_PORT},eureka:${LAB_EUREKA_PORT},kibana:${LAB_KIBANA_PORT},prometheus:${LAB_PROMETHEUS_PORT},grafana:${LAB_GRAFANA_PORT},es:${LAB_ES_PORT},redis:${LAB_REDIS_PORT}};";
    }

    # ---- 1) API GATEWAY: what an external client (browser / mobile app) would call -------------------------
    #      /gw/api/products  ->  http://api-gateway:8080/api/products
    location /gw/ {
        set $gateway http://api-gateway:8080;
        rewrite ^/gw/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    # ---- 2) EUREKA: registry JSON + the extra stats endpoint --------------------------------------------------
    location /api/eureka/ {
        set $eureka http://eureka-server:8761;
        rewrite ^/api/eureka/(.*)$ /eureka/$1 break;
        proxy_pass $eureka;
        proxy_set_header Accept "application/json";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location = /api/eureka-stats {
        set $eureka http://eureka-server:8761;
        rewrite ^ /lab/registry break;
        proxy_pass $eureka;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # ---- 3) ACTUATOR of any service (read-only whitelist) -----------------------------------------------------
    location ~ ^/api/raw/(?<svc>eureka-server|api-gateway|product-service-[123]|order-service|web-bff|mobile-bff)/(?<ep>actuator/[A-Za-z0-9/._-]+)$ {
        set $port 8080;
        if ($svc = eureka-server) { set $port 8761; }
        proxy_pass http://$svc:$port/$ep$is_args$args;
        proxy_connect_timeout 2s;
        proxy_read_timeout 6s;
    }

    # ---- 4) Call a service DIRECTLY (bypassing the gateway): whoami, client-side demo, health toggle --------
    location ~ ^/api/svc/(?<svc>order-service|product-service-[123]|web-bff|mobile-bff)/(?<rest>(lab|admin|api)/.*)$ {
        proxy_pass http://$svc:8080/$rest$is_args$args;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    # ---- 5) container control (pause / kill / start ...) -------------------------------------------------------
    location /api/ctl/ {
        set $ctl http://lab-control:9000;
        rewrite ^/api/ctl/(.*)$ /$1 break;
        proxy_pass $ctl;
        proxy_connect_timeout 2s;
        proxy_read_timeout 45s;
    }

    # ---- 6) PROMETHEUS query API (read-only) ----------------------------------------------------------------------
    location ~ ^/api/prom/(?<promPath>api/v1/(query|query_range|targets|alerts|rules|label/[a-z_]+/values|series))$ {
        proxy_pass http://prometheus:9090/$promPath$is_args$args;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # ---- 7) ELASTICSEARCH: only searching the log indices is allowed ------------------------------------------------
    location ~ ^/api/es/(?<esPath>(spring-logs-[A-Za-z0-9.*-]+/_(search|count)|_cluster/health|_cat/indices/spring-logs-[A-Za-z0-9.*-]+))$ {
        proxy_pass http://elasticsearch:9200/$esPath$is_args$args;
        proxy_set_header Content-Type "application/json";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # ---- 8) show the REAL source files next to the lessons (read-only mount of the repo) ---------------------------
    location ~ ^/repo/(?<file>((lab-common|eureka-server|api-gateway|product-service|order-service|bff-service)/(pom\.xml|src/main/.+\.(java|yml|xml))|infra/.+\.(yml|conf|json|sh)|docker-compose\.yml|Dockerfile|pom\.xml))$ {
        alias /srv/repo/$file;
        default_type text/plain;
        charset utf-8;
    }
}
